name: Fork tests

# Opt-in counterpart to CI's `build-test` job: runs exactly the suites that job
# excludes (`test/integration/**`). Never runs on PR/push cadence — public RPC
# forks are rate-limited and nondeterministic, so they must not gate PRs.
on:
  workflow_dispatch:
  schedule:
    # Weekly, Mondays 06:23 UTC. Off-minute on purpose: top-of-hour crons queue
    # behind GitHub's shared scheduler and get delayed or dropped.
    - cron: "23 6 * * 1"

concurrency:
  # Separate from CI's PR group so a fork run never cancels (or is cancelled
  # by) a PR check. Fork runs are rare and slow — let an in-flight one finish.
  group: fork-tests-${{ github.ref }}
  cancel-in-progress: false

env:
  # Keep in lockstep with .github/workflows/ci.yml.
  FOUNDRY_VERSION: v1.7.1
  FOUNDRY_PROFILE: default

jobs:
  fork-test:
    name: Fork & integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Public fallback for the one endpoint whose URL is already public
      # knowledge in this repo's docs/scripts, so a dispatch works out of the
      # box before any secret is configured.
      #
      # `BASE_RPC_URL` used to live here for the Base-mainnet suites. Those
      # strategies were deleted in e9c3512 and their only harness
      # (`test/integration/BaseIntegrationTest.sol`) had no subclasses left, so
      # both the harness and this variable are gone. Nothing under
      # test/integration/ reads a Base endpoint any more.
      ROBINHOOD_RPC_URL: ${{ secrets.ROBINHOOD_RPC_URL || 'https://rpc.mainnet.chain.robinhood.com' }}
      # Robinhood testnet (46630) has no public endpoint documented in this
      # repo, so it gets no fallback: secret-only, preflighted below. Read by
      # test/integration/RobinhoodIntegrationTest.sol.
      ROBINHOOD_TESTNET_RPC_URL: ${{ secrets.ROBINHOOD_TESTNET_RPC_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: ${{ env.FOUNDRY_VERSION }}

      - name: Build
        run: forge build

      # THE PATH FILTER IS THE EXACT COMPLEMENT OF ci.yml's `--no-match-path`
      # (both the `Test` and the `forge coverage` step). Keep the two strings
      # byte-identical: every suite in the repo runs in exactly one of the two
      # jobs, and a glob that drifts on one side either double-runs a suite or
      # — the failure that matters — silently runs it nowhere.
      #
      # NO `--fork-url`. Every remaining suite under test/integration/ either
      # calls `vm.createSelectFork` itself off the env vars above
      # (RobinhoodIntegrationTest, RobinhoodMainnetIntegrationTest,
      # UniswapAdapterRobinhoodForkTest, ConcentratedLiquidityMainnetForkTest,
      # MorphoSupplyMainnetForkTest) or needs no fork at all (TierEndToEndTest,
      # SwoodReviewSlashTest — both mock-only). The flag used to supply a
      # default Base fork for `BaseIntegrationTest`, which was deleted along
      # with the last of the Base-chain strategies.
      - name: Fork tests
        run: |
          forge test \
            --match-path "test/integration/**" \
            -vv

      # RUNS AFTER THE TESTS, AND THAT ORDER IS THE WHOLE POINT. The fork suites
      # read their RPC with `vm.envOr(..., "")` and `vm.skip(true)` when it is
      # empty, so a missing secret turns its suite into a green no-op that reads
      # as coverage — hence the loud failure.
      #
      # It used to run FIRST, and that made one missing secret block every
      # integration suite, including the ones whose endpoints have public
      # fallbacks and need no secret at all. The job died at this gate on
      # 2026-08-03, -08-10 and -08-17 without ever reaching `forge build`, so
      # nothing under test/integration/ had actually executed in CI for at least
      # three weeks — and the compile break in
      # `ConcentratedLiquidityVaultE2EFork.t.sol` that this ordering hid was only
      # found by hand. A gate that suppresses the signal it guards is worse than
      # the silence it is trying to prevent.
      #
      # `always()` so a genuine test failure above still surfaces this too.
      - name: Report endpoints with no secret and no fallback
        if: always()
        run: |
          missing=""
          for var in ROBINHOOD_TESTNET_RPC_URL; do
            if [ -z "${!var}" ]; then
              missing="$missing $var"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing — no public fallback exists for these endpoints, so the suites reading them SKIPPED rather than ran. Every other integration suite above did execute. Set them under Settings > Secrets and variables > Actions, then re-run."
            exit 1
          fi
          echo "OK: every endpoint without a public fallback has a secret set."
