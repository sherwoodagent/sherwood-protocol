name: Economics

# SHE-182. Re-runs the protocol economics model on demand and uploads the
# report as a workflow artifact. Drift against constants.lock.json is printed
# in the job log; it never blocks and never comments on a PR.

# MANUAL ONLY. Run from the Actions tab (or `gh workflow run economics.yml`).
# The report is uploaded as a workflow artifact visible to repo collaborators;
# it is never posted to a PR. Keep it this way while the repo is public.
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  economics:
    name: Scenario run & constant drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # stdlib only, by design — nothing to install.

      - name: Unit tests
        run: python3 -m unittest discover -s sim/economics -t sim/economics -v

      - name: Run the scenario set
        run: python3 sim/economics/run.py --allow-drift

      - name: Constant drift check
        id: drift
        run: |
          set +e
          python3 sim/economics/extract_constants.py --check > drift.txt 2>&1
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          cat drift.txt

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: economics-report
          path: sim/economics/out/
          if-no-files-found: warn
