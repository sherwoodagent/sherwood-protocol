name: Economics

# SHE-182. Re-runs the protocol economics model on any PR that touches the
# contracts, the deploy scripts, or the model itself, and posts the constant
# diff when a Solidity change moved a number the economics depend on.
#
# ADVISORY, NOT BLOCKING. The job renders with `--allow-drift` and always
# succeeds; drift shows up as a PR comment and inside the uploaded report, not
# as a red check. A constant change is a decision for a human to make, not
# something CI should veto — but it must never land unnoticed.

on:
  pull_request:
    paths:
      - "src/**"
      - "script/**"
      - "sim/economics/**"
      - ".github/workflows/economics.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  economics:
    name: Scenario run & constant drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # stdlib only, by design — nothing to install.

      - name: Unit tests
        run: python3 -m unittest discover -s sim/economics -t sim/economics -v

      - name: Run the scenario set
        run: python3 sim/economics/run.py --allow-drift

      - name: Constant drift check
        id: drift
        run: |
          set +e
          python3 sim/economics/extract_constants.py --check > drift.txt 2>&1
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          cat drift.txt

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: economics-report
          path: sim/economics/out/
          if-no-files-found: warn

      - name: Comment the constant diff on the PR
        # Only when something actually drifted, and only for same-repo PRs —
        # a fork PR's token cannot write comments, and failing there would turn
        # an advisory job into noise.
        if: >-
          steps.drift.outputs.exit_code != '0' &&
          github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const diff = fs.readFileSync('drift.txt', 'utf8').trim();
            const marker = '<!-- she-182-economics-drift -->';
            const body = [
              marker,
              '### Protocol constant drift',
              '',
              'A constant the economics model reads no longer matches ' +
              '`sim/economics/constants.lock.json`.',
              '',
              '```',
              diff,
              '```',
              '',
              'This is **advisory** — the check does not block. If the change is ' +
              'intended, run `python3 sim/economics/extract_constants.py --write` and ' +
              'commit the new lock in this PR, so the lock diff is the reviewable ' +
              'record of the economics change. The re-run report is attached to this ' +
              'workflow as the `economics-report` artifact.',
            ].join('\n');

            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const existing = await github.paginate(
              github.rest.issues.listComments, { owner, repo, issue_number });
            const mine = existing.find(c => c.body && c.body.includes(marker));
            if (mine) {
              await github.rest.issues.updateComment(
                { owner, repo, comment_id: mine.id, body });
            } else {
              await github.rest.issues.createComment(
                { owner, repo, issue_number, body });
            }
