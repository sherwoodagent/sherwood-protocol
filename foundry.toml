[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.28"
optimizer = true
optimizer_runs = 50
via_ir = true
ffi = false
# No CBOR metadata: it hashes the SOURCE, so a comment edit anywhere in a CREATE3
# contract's compilation unit would move its initcode hash and its deployed address.
bytecode_hash = "none"
cbor_metadata = false
# storageLayout in every artifact: the upgradeable contracts' layout goldens run
# `forge inspect <probe> storageLayout` after incremental builds — without this, a
# partial rebuild drops the layout from cached artifacts and inspect fails spuriously.
extra_output = ["storageLayout"]
fs_permissions = [
  { access = "read-write", path = "chains" },
  # Read-only: the source-hygiene test greps the ceremony scripts for `vm.env`.
  { access = "read", path = "script" },
]

[profile.default.fmt]
line_length = 120
tab_width = 4
bracket_spacing = false

[lint]
exclude_lints = ["screaming-snake-case-immutable", "mixed-case-variable"]

# Run coverage with `FOUNDRY_PROFILE=coverage forge coverage --ir-minimum`.
# Minimal IR optimization avoids legacy codegen's stack limit while retaining
# coverage instrumentation for every production file. Source maps are approximate
# under IR; coverage remains advisory. Do not reintroduce per-file IR restrictions:
# forge omits those compilation units from coverage entirely.
[profile.coverage]
via_ir = true

# The CREATE3 factory's address is keccak of its own creation code, pinned in DeploySalts.
# `type(X).creationCode` is emitted by whoever REFERENCES it, so every embedder must build
# the way the ceremony does or the pin reads as a drift under legacy codegen.
[[profile.coverage.compilation_restrictions]]
paths = "script/utils/Create3Factory.sol"
via_ir = true

[[profile.coverage.compilation_restrictions]]
paths = "script/ScriptBase.sol"
via_ir = true

[[profile.coverage.compilation_restrictions]]
paths = "script/robinhood-mainnet/DeployAll.s.sol"
via_ir = true

[[profile.coverage.compilation_restrictions]]
paths = "test/factory/deploy/Create3Bootstrap.t.sol"
via_ir = true

[[profile.coverage.compilation_restrictions]]
paths = "test/factory/deploy/DeployAll.t.sol"
via_ir = true

# Profile used by the Medusa/Echidna harness under test/fizz/. The fuzzers compile
# through crytic-compile, which shells out to this profile.
#
# via_ir stays on because the harness links against the largest contracts and
# legacy codegen exceeds the stack limit. Unlike coverage, nothing here overrides
# via_ir, so one setting covers the whole project.
#
# The optimizer is off deliberately. A fuzzing campaign rebuilds far more often than
# it runs any single sequence, so 50 optimizer runs cost more wall-clock in compiles
# than they save in execution — and unoptimized bytecode keeps Medusa's per-line
# coverage output mapped to real source lines.
[profile.fuzz]
via_ir = true
optimizer = false
optimizer_runs = 0

[rpc_endpoints]
base = "${BASE_RPC_URL}"
base_sepolia = "${BASE_SEPOLIA_RPC_URL}"
robinhood_testnet = "${ROBINHOOD_TESTNET_RPC_URL}"
robinhood = "${ROBINHOOD_RPC_URL}"
robinhood_fork = "${TENDERLY_ROBINHOOD_RPC_URL}"
tenderly = "${TENDERLY_RPC_URL}"

[etherscan]
