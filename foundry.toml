[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.28"
optimizer = true
optimizer_runs = 50
via_ir = true
ffi = false
# storageLayout in every artifact: script/check-storage-parity.sh runs `forge inspect
# <probe> storageLayout` after incremental builds — without this, a partial rebuild
# drops the layout from cached artifacts and inspect fails spuriously.
extra_output = ["storageLayout"]
fs_permissions = [
  { access = "read-write", path = "chains" },
]

[profile.default.fmt]
line_length = 120
tab_width = 4
bracket_spacing = false

[lint]
exclude_lints = ["screaming-snake-case-immutable", "mixed-case-variable"]

# forge coverage is incompatible with via_ir (Yul stack-too-deep) — pin to legacy pipeline
[profile.coverage]
via_ir = false

[rpc_endpoints]
base = "${BASE_RPC_URL}"
base_sepolia = "${BASE_SEPOLIA_RPC_URL}"
robinhood_testnet = "${ROBINHOOD_TESTNET_RPC_URL}"
robinhood = "${ROBINHOOD_RPC_URL}"
robinhood_fork = "${TENDERLY_ROBINHOOD_RPC_URL}"
tenderly = "${TENDERLY_RPC_URL}"

[etherscan]
